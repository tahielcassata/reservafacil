<style>
  :root { --azul:#2f5d8a; --azul-claro:#eaf1f8; --verde:#2e9e5b; --verde-claro:#e6f4ec; --verde-osc:#1f6e42;
          --gris:#5b6570; --borde:#d5dbe1; --fondo:#f4f6f8; --rojo:#c0392b; --texto:#1c1f23; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--fondo); color:var(--texto); }
  .app { max-width:480px; margin:0 auto; min-height:100vh; background:#fff; }
  header { background:var(--azul); color:#fff; padding:18px 20px; }
  header small { opacity:.85; font-size:13px; }
  header h1 { margin:4px 0 0; font-size:21px; font-weight:600; }
  .pasos { display:flex; gap:6px; margin-top:12px; }
  .pasos span { flex:1; height:5px; border-radius:3px; background:rgba(255,255,255,.3); }
  .pasos span.on { background:#fff; }
  main { padding:18px 20px 28px; }
  h2 { font-size:18px; margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .op { min-height:54px; border:1.5px solid var(--borde); border-radius:12px; background:#fff; font-size:16px; font-weight:600; color:var(--texto); cursor:pointer; padding:6px; }
  .op small { display:block; font-weight:400; font-size:12px; color:var(--gris); }
  .op.sel { border:2.5px solid var(--azul); background:var(--azul-claro); color:var(--azul); }
  label { display:block; font-size:14px; color:var(--gris); margin:14px 0 6px; }
  input[type=text], input[type=tel], input[type=password], select {
    width:100%; height:50px; border:1.5px solid var(--borde); border-radius:10px; padding:0 14px; font-size:16px; background:#fff; color:var(--texto); }
  input:focus, select:focus { outline:none; border-color:var(--azul); }
  label.check { display:flex; gap:10px; align-items:center; font-size:15px; color:var(--texto); margin:16px 0 4px; }
  label.check input { width:22px; height:22px; flex-shrink:0; }
  .btn { display:flex; align-items:center; justify-content:center; width:100%; height:54px; border:0; border-radius:12px;
         background:var(--azul); color:#fff; font-size:17px; font-weight:600; margin-top:12px; cursor:pointer; text-decoration:none; }
  .btn.sec { background:#fff; color:var(--azul); border:1.5px solid var(--azul); }
  .btn.wa { background:var(--verde); }
  .btn:disabled { opacity:.6; }
  .fila2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .error { color:var(--rojo); font-size:14px; min-height:18px; margin:8px 0 0; }
  .nota { font-size:13px; color:var(--gris); margin:0 0 12px; }
  .aviso-ok { background:var(--verde-claro); color:var(--verde-osc); border-radius:10px; padding:10px 12px; font-size:14px; margin:0 0 12px; }
  .resumen { border:1px solid var(--borde); border-radius:12px; padding:12px 14px; font-size:15px; line-height:1.8; }
  .fila { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid #eef1f4; }
  .fila .h { font-weight:700; width:50px; flex-shrink:0; }
  .fila .n { flex:1; min-width:0; overflow-wrap:anywhere; }
  .fila .n span { display:block; font-size:13px; color:var(--gris); }
  .tag { font-size:12px; font-weight:600; border-radius:20px; padding:3px 10px; white-space:nowrap; }
  .t-Online { background:var(--verde-claro); color:var(--verde-osc); }
  .t-Dueño { background:var(--azul-claro); color:var(--azul); }
  .t-Bloqueo { background:#eef1f4; color:var(--gris); }
  .mini { border:1px solid var(--borde); background:#fff; border-radius:8px; padding:8px 10px; font-size:13px; cursor:pointer; color:var(--texto); white-space:nowrap; }
  .mini.wa { background:var(--verde); border-color:var(--verde); color:#fff; text-decoration:none; font-weight:600; }
  .ok { color:var(--verde-osc); font-weight:600; font-size:14px; white-space:nowrap; }
  .tabs { display:flex; background:#fff; border-bottom:1px solid var(--borde); position:sticky; top:0; z-index:2; }
  .tabs button { flex:1; height:50px; border:0; background:none; font-size:15px; color:var(--gris); border-bottom:3px solid transparent; cursor:pointer; }
  .tabs button.on { color:var(--azul); border-bottom-color:var(--azul); font-weight:600; }
  .cargando { color:var(--gris); font-size:14px; padding:10px 0; grid-column:1/-1; }
  .vacio { color:var(--gris); font-size:14px; padding:14px 0; grid-column:1/-1; }
  .confirmar { display:flex; gap:6px; flex-shrink:0; }
  .mini.peligro { background:var(--rojo); border-color:var(--rojo); color:#fff; font-weight:600; }
  .caja { border:1.5px solid #e8c36a; background:#fffaf0; border-radius:12px; padding:14px; margin:14px 0; font-size:15px; }
  .caja h2 { font-size:16px; margin:0 0 8px; }
  .caja .mini.wa { display:inline-block; }
  .oculto { display:none !important; }
  .centro { text-align:center; }
  .tilde { width:76px; height:76px; border-radius:50%; background:var(--verde-claro); color:var(--verde-osc); font-size:40px;
           display:flex; align-items:center; justify-content:center; margin:20px auto 14px; }
</style>
